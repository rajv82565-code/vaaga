<title>Deity Jet Particle Demo</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Segoe UI',Roboto,Arial,sans-serif;}
  #stage{position:relative;width:100vw;height:100vh;height:100dvh;}
  canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;}
  .ui{
    position:absolute;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:5;flex-wrap:wrap;
    padding-top: calc(18px + env(safe-area-inset-top,0px));
  }
  .ui button{
    background:rgba(15,15,15,0.55);border:1px solid rgba(255,255,255,0.18);
    color:#eee;padding:8px 16px;border-radius:999px;font-size:13px;letter-spacing:.03em;
    cursor:pointer;backdrop-filter:blur(6px);transition:all .2s ease;
  }
  .ui button:hover{border-color:#ff8a3d;color:#ff8a3d;box-shadow:0 0 14px rgba(255,138,61,.35);}
  .ui button.active{background:rgba(255,138,61,0.15);border-color:#ff8a3d;color:#ff8a3d;}
  .caption{
    position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:0;right:0;
    text-align:center;color:#9aa0a6;font-size:12px;letter-spacing:.04em;z-index:5;padding:0 16px;
  }
  .caption b{color:#eee;font-weight:600;}
</style>
</head>

  </div>

</div>

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W,H,DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1,2);
  W = canvas.clientWidth = window.innerWidth;
  H = canvas.clientHeight = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', ()=>{ resize(); layoutParticles(); });

let stars = [];
function makeStars(){
  stars = [];
  const count = Math.floor((W*H)/9000);
  for(let i=0;i<count;i++){
    stars.push({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.4+0.3,
      base: Math.random()*0.5+0.15,
      speed: Math.random()*0.02+0.005,
      phase: Math.random()*Math.PI*2,
      big: Math.random()<0.02
    });
  }
}

let particles = [];
let colorMode = 'original';
let assembleStart = 0;
const ASSEMBLE_MS = 2200;

function sampleImage(){
  const off = document.createElement('canvas');
  const targetW = 340;
  const scale = targetW/img.width;
  const targetH = Math.round(img.height*scale);
  off.width = targetW; off.height = targetH;
  const octx = off.getContext('2d');
  octx.imageSmoothingEnabled = true;
  octx.drawImage(img,0,0,targetW,targetH);
  const data = octx.getImageData(0,0,targetW,targetH).data;

  const pts = [];
  for(let y=0;y<targetH;y++){
    for(let x=0;x<targetW;x++){
      const idx=(y*targetW+x)*4;
      const r=data[idx],g=data[idx+1],b=data[idx+2],a=data[idx+3];
      const lum = 0.299*r+0.587*g+0.114*b;
      if(a<40 || lum < 14) continue;
      // keep near-full density; only thin out the darkest/background-adjacent pixels
      const skipProb = lum < 45 ? 0.35 : 0.06;
      if(Math.random() < skipProb) continue;
      pts.push({u:x/targetW, v:y/targetH, r,g,b,lum});
    }
  }
  return pts;
}

function layoutParticles(){
  const raw = sampleImage();
  const targetH = H*0.9;
  const aspect = img.width/img.height;
  const targetW = targetH*aspect;
  const offsetX = W*0.55 - targetW/2;
  const offsetY = H*0.5 - targetH/2;

  particles = raw.map(p=>{
    const px = offsetX + p.u*targetW;
    const py = offsetY + p.v*targetH;
    return {
      tx:px, ty:py,
      x: W/2 + (Math.random()-0.5)*W*1.4,
      y: H/2 + (Math.random()-0.5)*H*1.4,
      size: Math.random()*1.05+0.45,
      r:p.r,g:p.g,b:p.b,lum:p.lum,
      phase: Math.random()*Math.PI*2,
      speed: Math.random()*0.015+0.006,
      drift: Math.random()*2.0+0.5,
      twinkleSpeed: Math.random()*0.03+0.01
    };
  });
  assembleStart = performance.now();
}

function themeColor(p){
  const warm = (p.r>p.g && p.r>90);
  const t = p.lum/255;
  return warm ? `rgba(232,178,74,${0.55+t*0.45})` : `rgba(45,224,216,${0.5+t*0.5})`;
}
function originalColor(p){
  return `rgba(${p.r},${p.g},${p.b},0.92)`;
}

let t=0;
function draw(now){
  t++;
  ctx.clearRect(0,0,W,H);
  const grad = ctx.createRadialGradient(W*0.58,H*0.5,10,W*0.58,H*0.5,Math.max(W,H)*0.6);
  grad.addColorStop(0,'rgba(45,15,10,0.35)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

  for(const s of stars){
    const tw = s.base + Math.sin(t*s.speed+s.phase)*0.25;
    ctx.beginPath();
    ctx.fillStyle = s.big ? `rgba(255,150,90,${Math.max(0,tw)})` : `rgba(255,255,255,${Math.max(0,tw)})`;
    const r = s.big ? s.r*2.2 : s.r;
    ctx.arc(s.x,s.y,r,0,Math.PI*2); ctx.fill();
  }

  const elapsed = now-assembleStart;
  const prog = Math.min(1, elapsed/ASSEMBLE_MS);
  const ease = 1-Math.pow(1-prog,3);

  ctx.save();
  for(const p of particles){
    const cx = p.x+(p.tx-p.x)*ease;
    const cy = p.y+(p.ty-p.y)*ease;
    const wobbleX = Math.sin(t*p.speed+p.phase)*p.drift*ease;
    const wobbleY = Math.cos(t*p.speed*1.3+p.phase)*p.drift*ease;
    const flick = 0.6+Math.sin(t*p.twinkleSpeed+p.phase)*0.4;
    ctx.globalAlpha = Math.max(0.05,flick)*(0.4+0.6*ease);
    ctx.fillStyle = colorMode==='theme' ? themeColor(p) : originalColor(p);
    ctx.beginPath();
    ctx.arc(cx+wobbleX, cy+wobbleY, p.size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
  requestAnimationFrame(draw);
}

function init(){ resize(); makeStars(); layoutParticles(); requestAnimationFrame(draw); }
img.onload = init;

document.getElementById('btnOriginal').onclick = ()=>{
  colorMode='original';
  document.getElementById('btnOriginal').classList.add('active');
  document.getElementById('btnTheme').classList.remove('active');
};
document.getElementById('btnTheme').onclick = ()=>{
  colorMode='theme';
  document.getElementById('btnTheme').classList.add('active');
  document.getElementById('btnOriginal').classList.remove('active');
};
document.getElementById('btnAssemble').onclick = ()=>{ layoutParticles(); };
</script>
